name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Check Python syntax
        run: python3 -m compileall -q scripts

      - name: Check JavaScript syntax
        run: find js scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Parse JSON data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          count = 0
          for path in sorted(Path("data").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              count += 1
          print(f"parsed {count} JSON files")
          PY

      - name: Audit official candidate sources
        run: python3 scripts/audit_candidate_sources.py

      - name: Cross-validate candidate data
        run: python3 scripts/candidate_pipeline/cross_validate.py --strict

      - name: Verify data health dry-run is read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_data_health_dry_run_no_write.py

      - name: Run quality gate
        run: npm run check:all

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
