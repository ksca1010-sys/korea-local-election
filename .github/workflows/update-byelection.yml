name: Update By-Election Data

on:
  workflow_dispatch:
    inputs:
      approve_llm_cost:
        description: '명시 승인: Gemini 재보궐 뉴스 분석/후보 팩트체크 실행 (비용 발생 가능)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: check
        name: 선거일 게이팅 확인 (election_meta.json + 7일)
        run: |
          python3 -c "
          import json
          from datetime import date, timedelta
          meta = json.load(open('data/static/election_meta.json'))
          cutoff = date.fromisoformat(meta['electionDate']) + timedelta(days=7)
          active = date.today() <= cutoff
          print('active=' + ('true' if active else 'false'))
          " >> $GITHUB_OUTPUT

  update:
    needs: gate
    if: needs.gate.outputs.active == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RUN_LLM_FACTCHECK: ${{ inputs.approve_llm_cost || false }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Show LLM approval state
        run: echo "run_llm_factcheck=${RUN_LLM_FACTCHECK}"

      - name: Step 1 - Detect new districts (NEC API)
        env:
          NEC_API_KEY: ${{ secrets.NEC_API_KEY }}
          NECDC_CODE: ${{ secrets.NECDC_CODE }}
          NDCDC_LOCAL: ${{ secrets.NDCDC_LOCAL }}
          NDCDC_PAPER: ${{ secrets.NDCDC_PAPER }}
          NDCDC_PERSON: ${{ secrets.NDCDC_PERSON }}
        run: |
          KEY="${NEC_API_KEY:-${NDCDC_PERSON:-${NDCDC_LOCAL:-${NDCDC_PAPER:-$NECDC_CODE}}}}"; export NEC_API_KEY="$KEY"
          python scripts/candidate_pipeline/detect_byelections.py --apply

      - name: Step 2 - Fetch & update candidates (news + NEC)
        if: env.RUN_LLM_FACTCHECK == 'true'
        env:
          NEC_API_KEY: ${{ secrets.NEC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NECDC_CODE: ${{ secrets.NECDC_CODE }}
          NDCDC_LOCAL: ${{ secrets.NDCDC_LOCAL }}
          NDCDC_PAPER: ${{ secrets.NDCDC_PAPER }}
          NDCDC_PERSON: ${{ secrets.NDCDC_PERSON }}
        run: |
          KEY="${NEC_API_KEY:-${NDCDC_PERSON:-${NDCDC_LOCAL:-${NDCDC_PAPER:-$NECDC_CODE}}}}"; export NEC_API_KEY="$KEY"
          python scripts/candidate_pipeline/fetch_byelection.py

      - name: Step 3 - Factcheck candidates
        if: env.RUN_LLM_FACTCHECK == 'true'
        env:
          NEC_API_KEY: ${{ secrets.NEC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          NECDC_CODE: ${{ secrets.NECDC_CODE }}
          NDCDC_LOCAL: ${{ secrets.NDCDC_LOCAL }}
          NDCDC_PAPER: ${{ secrets.NDCDC_PAPER }}
          NDCDC_PERSON: ${{ secrets.NDCDC_PERSON }}
        run: |
          KEY="${NEC_API_KEY:-${NDCDC_PERSON:-${NDCDC_LOCAL:-${NDCDC_PAPER:-$NECDC_CODE}}}}"; export NEC_API_KEY="$KEY"
          python scripts/candidate_pipeline/factcheck_byelection.py

      - name: Validate pipeline data
        run: python scripts/candidate_pipeline/validate_pipeline.py

      - name: Assert byelection data not empty
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('data/candidates/byelection.json'))
          districts = d.get('districts', {})
          total = sum(len(v.get('candidates', [])) for v in districts.values() if isinstance(v, dict))
          if len(districts) < 1:
              print(f'FATAL: byelection.json에 선거구 없음 — 파이프라인 실패 의심')
              sys.exit(1)
          print(f'OK: byelection — {len(districts)}개 선거구, {total}명 후보')
          "

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet data/candidates/byelection.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates/byelection.json
          git commit -m "chore: auto-update byelection data $(date +%Y-%m-%d)"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              pushed=true
              break
            fi
            echo "push attempt $i failed, retrying..."
            sleep 10
          done
          if [ "$pushed" != "true" ]; then
            echo "push failed after 3 attempts" >&2
            exit 1
          fi
