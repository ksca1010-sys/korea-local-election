name: Monitor Automation Failures

on:
  schedule:
    # 매일 한국시간 13:30 (UTC 04:30) — 정오 Data Health Check 실행 누락 감지
    - cron: '30 4 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update Candidate Data"
      - "Update Gallup National Poll"
      - "Poll Sync (NESDC)"
      - "Update Election Overview"
      - "Update Election Stats"
      - "Update Governor Status"
      - "Update Mayor Status"
      - "Update Superintendent Status"
      - "Update By-Election Data"
      - "Data Health Check"
      - "공보물 데이터 수집 (선관위 API)"
      - "Update Local Council Members"
      - "Update Local Media Pool"
      - "Sync NEC Official Candidates"
      - "CI"
    types: [completed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write    # GitHub Issue 자동 생성 권한
      actions: write   # 실패 로그 조회 + heartbeat 누락 시 수동 재실행

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Run failure monitor
        id: event_monitor
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/monitor_failures.py \
            --workflow "${{ github.event.workflow_run.name }}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --conclusion "${{ github.event.workflow_run.conclusion }}" \
            --run-url "${{ github.event.workflow_run.html_url }}"

      - name: Check scheduled workflow heartbeat
        id: schedule_monitor
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/monitor_failures.py --check-schedules

      - name: Commit updated failure counts
        if: always()
        run: |
          git diff --quiet data/.failure_counts.json 2>/dev/null || {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/.failure_counts.json
            git commit -m "chore: update failure counts [skip ci]"
            git pull --rebase origin main && git push
          }

      - name: Fail if monitor found issues
        if: steps.event_monitor.outcome == 'failure' || steps.schedule_monitor.outcome == 'failure'
        run: exit 1
